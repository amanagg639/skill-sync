server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/user/**
      discovery:
        locator:
          enabled: true
eureka:
  instance:
    hostname: localhost
    preferIPAddress: true
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret:
    key: 1a425803fd6b8bbb02a0e2eb5aaae22ebacbd423a5abf21d713f390a458220bc8224631d789c14826b971aa6ddf0460061c9a6682aa674ad14824e1d11882105
  expiration:
    ms: 86400000

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG
    reactor.netty: DEBUG